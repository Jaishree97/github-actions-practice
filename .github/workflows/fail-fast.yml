name: Fail Fast and Exclude Demo

on: 
    push:
        branches: [main]

jobs:
  matrix-exclude-fail-fast:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - windows-latest
          - ubuntu-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

        exclude:
          - os: windows-latest
            python-version: "3.10"

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python Version
        run: python --version

      - name: Trigger Failure
        if: matrix.python-version == '3.11'
        run: exit 1